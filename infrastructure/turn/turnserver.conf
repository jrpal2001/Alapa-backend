# Coturn TURN/STUN Server Configuration for Alapa WebRTC

# Listening port for STUN/TURN requests
listening-port=3478
tls-listening-port=5349

# Server identity & domain
realm=alapa.app
server-name=alapa-turn

# External IP configuration (Replace with public server IP or domain in production)
# external-ip=YOUR_PUBLIC_SERVER_IP

# Authentication mechanisms
lt-cred-mech
user=alapastun:AlapaTurnSecret2026!

# Fingerprint support (required for WebRTC)
fingerprint

# Disable CLI / Telnet admin interface for security
no-cli

# Logging setup
log-file=stdout
syslog

# Supported IP protocols
listening-ip=0.0.0.0

# Security settings
no-loopback-peers
no-multicast-peers
